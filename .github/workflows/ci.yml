# Continuous Integration: runs on every push to main and on every pull request.
# Lint + test the API, lint + test + build the frontend. A red check blocks merging broken code,
# and Render only deploys main once these checks pass (autoDeployTrigger in render.yaml).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the code, so the workflow's GitHub token gets no other rights.
permissions:
  contents: read

# A new push to a pull request cancels its older, now outdated run. Runs on main always finish,
# because Render waits for them before deploying.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: Server · lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  client:
    name: Client · lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
