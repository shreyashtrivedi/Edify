# Continuous Integration: runs on every push and pull request.
# Lint + test the API, lint + build the frontend. A red check blocks merging broken code.
# (Deployment itself is handled by Render and Vercel, which auto-deploy main.)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server · lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  client:
    name: Client · lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
