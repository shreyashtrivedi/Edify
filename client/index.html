<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Edify turns any topic into a structured, multi-module online course with AI."
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Edify · Text-to-Learn</title>
    <script>
      // Apply the saved theme before the first paint, so dark-mode users never see a white
      // flash while the JS bundle downloads. Same logic as src/utils/theme.js (keep in sync).
      (function () {
        try {
          var saved = localStorage.getItem('edify-theme');
          var dark =
            saved === 'dark' ||
            (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#18181b');
          }
        } catch (e) {
          // Storage blocked: the app falls back to the OS setting once it loads.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
